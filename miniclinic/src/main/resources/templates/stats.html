<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>掛號統計 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #0F2443; border-bottom: 3px solid #14B8A6; padding-bottom: 8px; }
        nav { background: #0F2443; padding: 12px; border-radius: 8px; }
        nav a { color: white; margin-right: 20px; text-decoration: none; font-weight: bold; }
        nav a:hover { color: #5EEAD4; }
        section { margin-top: 24px; }
        .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
        .card { background: #F3F4F6; padding: 18px; border-radius: 12px; box-shadow: 0 2px 6px rgba(15, 36, 67, 0.08); }
        .card h2 { margin: 0 0 10px; color: #0F2443; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px 14px; border: 1px solid #CBD5E1; text-align: left; }
        th { background: #E2E8F0; }
    </style>
</head>
<body>
    <h1>掛號統計</h1>
    <nav>
        <a th:href="@{/}">首頁</a>
        <a th:href="@{/doctors}">醫師清單</a>
        <a th:href="@{/patients}">病歷資料</a>
        <a th:href="@{/appointment/new}">線上掛號</a>
        <a th:href="@{/appointments}">掛號記錄</a>
        <a th:href="@{/stats}">掛號統計</a>
    </nav>
    <section>
        <div class="summary">
            <div class="card">
                <h2>醫師總數</h2>
                <p th:text="${doctorCount}">0</p>
            </div>
            <div class="card">
                <h2>病患總數</h2>
                <p th:text="${patientCount}">0</p>
            </div>
            <div class="card">
                <h2>掛號總數</h2>
                <p th:text="${appointmentCount}">0</p>
            </div>
        </div>

        <h2>依科別分組的掛號數</h2>
        <table>
            <thead>
                <tr>
                    <th>科別</th>
                    <th>掛號數</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="entry : ${apptCountByDepartment}">
                    <td th:text="${entry.key}">科別</td>
                    <td th:text="${entry.value}">0</td>
                </tr>
            </tbody>
        </table>
    </section>
</body>
</html>
