<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密碼 - MiniClinic</title>
</head>
<body>
    <h1>修改密碼</h1>
    <p>醫師：<span th:text="${loggedInDoctorName}">醫師姓名</span></p>

    <!-- 滿足需求：錯誤訊息顯示區塊 -->
    <div th:if="${errorMessage}" style="color: #DC2626; background: #FEE2E2; padding: 10px; border-radius: 4px; margin-bottom: 10px;" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" style="color: green;" th:text="${successMessage}"></div>

    <form th:action="@{/password}" th:object="${passwordForm}" method="post">
        <div>
            <label>舊密碼：</label>
            <input type="password" th:field="*{oldPassword}" required />
            <span th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}" style="color: red;"></span>
        </div>
        <div>
            <label>新密碼 (至少 8 碼)：</label>
            <input type="password" th:field="*{newPassword}" required />
            <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" style="color: red;"></span>
        </div>
        <div>
            <label>確認新密碼：</label>
            <input type="password" th:field="*{confirmPassword}" required />
            <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color: red;"></span>
        </div>
        <button type="submit">確認修改</button>
    </form>

    <hr>
    <a th:href="@{/dashboard}">回管理後端</a>
</body>
</html>
